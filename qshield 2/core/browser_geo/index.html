<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QShield device location</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    button { border: 1px solid #64748b; border-radius: 9px; padding: 9px 13px; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #7c3aed; outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { flex: 1 1 220px; color: var(--text-color, inherit); }
    .muted { opacity: .75; }
  </style>
</head>
<body>
  <div class="panel">
    <button id="request" type="button">Request device location</button>
    <span id="status" role="status" aria-live="polite">Location is not requested until you press the button.</span>
  </div>
  <script>
    (function () {
      "use strict";
      const button = document.getElementById("request");
      const status = document.getElementById("status");
      let pending = false;

      function send(value) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setComponentValue",
          value: value,
          dataType: "json"
        }, "*");
      }

      function frameHeight() {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: "streamlit:setFrameHeight",
          height: document.body.scrollHeight
        }, "*");
      }

      function setStatus(text) {
        status.textContent = text;
        frameHeight();
      }

      button.addEventListener("click", function () {
        if (pending) return;
        if (!navigator.geolocation) {
          setStatus("This browser does not support device location.");
          send({ status: "error", code: "UNSUPPORTED" });
          return;
        }

        pending = true;
        button.disabled = true;
        setStatus("Waiting for browser permission and a location reading…");

        navigator.geolocation.getCurrentPosition(
          function (position) {
            pending = false;
            button.disabled = false;
            setStatus("Device location received for this session. You can request a fresh reading.");
            send({
              status: "success",
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            });
          },
          function (error) {
            pending = false;
            button.disabled = false;
            let code = "POSITION_UNAVAILABLE";
            let text = "The browser could not obtain a reliable location.";
            if (error && error.code === 1) {
              code = "PERMISSION_DENIED";
              text = "Location permission was denied. Allow it in the browser or select a demo scenario.";
            } else if (error && error.code === 3) {
              code = "TIMEOUT";
              text = "Location request timed out. Try again or select a demo scenario.";
            }
            setStatus(text);
            send({ status: "error", code: code });
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });

      window.addEventListener("message", function (event) {
        if (event.source !== window.parent || !event.data) return;
        if (event.data.type === "streamlit:render") {
          frameHeight();
        }
      });

      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      frameHeight();
    }());
  </script>
</body>
</html>
